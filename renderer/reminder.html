<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <title>WorkTime</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <main class="popup__panel" role="alertdialog" aria-labelledby="title" aria-describedby="sub">
      <div class="popup__card">
        <img class="popup__icon" src="../assets/icon.png" alt="" />
        <div>
          <p class="popup__eyebrow" id="eyebrow"></p>
          <h1 class="popup__title" id="title"></h1>
          <p class="popup__sub" id="sub"></p>
        </div>
      </div>
      <div class="popup__actions">
        <button class="btn btn--secondary" type="button" id="snooze"></button>
        <button class="btn btn--primary" type="button" id="done"></button>
      </div>
    </main>
    <script src="reminder.js"></script>
  </body>
</html>
